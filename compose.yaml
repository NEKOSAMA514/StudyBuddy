services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${APP_PORT:-18000}:8000"
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    volumes:
      - ./data:/data
      - ./models:/models
      - ./log:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
